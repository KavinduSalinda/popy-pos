name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: popy-fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: popy-fe/package-lock.json
      - run: npm ci
        env:
          HUSKY: '0'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
        env:
          CI: 'true'

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            popy-be/requirements.txt
            tests/requirements.txt
# CI workflow: mysqlclient needs headers even when tests use SQLite
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config build-essential
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../popy-be/requirements.txt
          pip install -r requirements.txt
      - name: Run API tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          USE_SQLITE: 'True'
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: 'True'
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: pytest backend -q --tb=short
